# This is an example Hyprland config file.
# Refer to the wiki for more information.
# https://wiki.hyprland.org/Configuring/

# Please note not all available settings / options are set here.
# For a full list, see the wiki

# You can split this configuration into multiple files
# Create your files separately and then link them to this file like this:
source = ~/.config/hypr/mocha.conf
exec-once = hyprpaper

#exec-once = hyprctl setcursor catppuccin-mocha-dark-cursors 24

################
### MONITORS ###
################

# See https://wiki.hyprland.org/Configuring/Monitors/
# "preferred" picks the panel's native mode, so this works on any machine.
# Scale stays 1.2; drop to 1 if things look too large on a 1080p panel.
monitor=,preferred,auto,1.2



###################
### MY PROGRAMS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/

# Set programs that you use
$terminal = kitty
$fileManager = nautilus
$menu = wofi --show drun
$screenshotDir = ~/Pictures/Screenshots


#################
### AUTOSTART ###
#################

# Autostart necessary processes (like notifications daemons, status bars, etc.)
# Or execute your favorite apps at launch like this:

# exec-once = $terminal
# exec-once = nm-applet &
exec-once = waybar
# Clipboard history: watch the Wayland clipboard and store changes with cliphist
exec-once = wl-paste --watch cliphist store
# notifications: mako is provided by the user service `mako.service` (systemctl --user status mako)
# uncomment the next line if you don't have that service
# exec-once = mako
# Idle daemon (dim / lock / screen-off). It is started *through systemd* so it can
# be paused and resumed at will: Ctrl+Super+I, or the waybar indicator by the clock.
# The pkill nudges waybar so the indicator reflects the real state right away.
exec-once = systemctl --user start hypridle.service && sleep 1 && pkill -RTMIN+9 waybar
#############################
### ENVIRONMENT VARIABLES ###
#############################

# See https://wiki.hyprland.org/Configuring/Environment-variables/

env = XCURSOR_SIZE,20
env = HYPRCURSOR_SIZE,20

env = QT_QPA_PLATFORMTHEME,qt5ct # change to qt6ct if you have that

#####################
### LOOK AND FEEL ###
#####################

# Refer to https://wiki.hyprland.org/Configuring/Variables/

# https://wiki.hyprland.org/Configuring/Variables/#general
general {
    gaps_in = 4
    gaps_out = 2

    border_size = 2

    # https://wiki.hyprland.org/Configuring/Variables/#variable-types for info about colors
    #col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.active_border = $mauve $flamingo 90deg
    col.inactive_border = $subtext0
    # Set to true enable resizing windows by clicking and dragging on borders and gaps
    resize_on_border = true

    # Please see https://wiki.hyprland.org/Configuring/Tearing/ before you turn this on
    allow_tearing = true

    layout = dwindle

}

# https://wiki.hyprland.org/Configuring/Variables/#decoration
decoration {
    rounding = 2

    # Change transparency of focused and unfocused windows
    active_opacity = 1.0
    inactive_opacity = 1.0


    # https://wiki.hyprland.org/Configuring/Variables/#blur
  # blur {
  #     enabled = true
  #     size = 3
  #     passes = 1
  #}
  # drop_shadow = yes
  # shadow_range = 4
  # shadow_render_power = 3
  # col.shadow = rgba(1a1a1aee)
}

# https://wiki.hyprland.org/Configuring/Variables/#animations
animations {
    enabled = false


}

# Ref https://wiki.hyprland.org/Configuring/Workspace-Rules/
# "Smart gaps" / "No gaps when only"
# uncomment all if you wish to use that.
# workspace = w[tv1], gapsout:0, gapsin:0
# workspace = f[1], gapsout:0, gapsin:0
# windowrulev2 = bordersize 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = rounding 0, floating:0, onworkspace:w[tv1]
# windowrulev2 = bordersize 0, floating:0, onworkspace:f[1]
# windowrulev2 = rounding 0, floating:0, onworkspace:f[1]

# See https://wiki.hyprland.org/Configuring/Dwindle-Layout/ for more
dwindle {
    # NOTE: dwindle:pseudotile was removed in Hyprland 0.55 (it did nothing)
    preserve_split = true # You probably want this (required for layoutmsg togglesplit)
}

# See https://wiki.hyprland.org/Configuring/Master-Layout/ for more
master {
    new_status = master
}

# https://wiki.hyprland.org/Configuring/Variables/#misc
misc {
    force_default_wallpaper = 0 # Set to 0 or 1 to disable the anime mascot wallpapers
    disable_hyprland_logo = true # If true disables the random hyprland logo / anime girl background. :(
}


#############
### INPUT ###
#############

# https://wiki.hyprland.org/Configuring/Variables/#input
input {
    kb_layout = us
    kb_variant =
    kb_model =
    # caps:super -> Caps Lock acts as an additional Super, so every Super keybind
    # below also works when pressed with Caps Lock (the real Super key still works).
    kb_options = caps:super
    kb_rules =

    follow_mouse = 1

    sensitivity = 1 # -1.0 - 1.0, 0 means no modification.

    touchpad {
        natural_scroll = true
    }
}

# https://wiki.hypr.land/Configuring/Advanced-and-Cool/Gestures/
# gestures:workspace_swipe was removed in Hyprland 0.51, replaced by `gesture`
gesture = 3, horizontal, workspace

# Example per-device config
# See https://wiki.hyprland.org/Configuring/Keywords/#per-device-input-configs for more
#device {
#    name = epic-mouse-v1
#    sensitivity = -0.5
#}


###################
### KEYBINDINGS ###
###################

# See https://wiki.hyprland.org/Configuring/Keywords/
$mainMod = SUPER # Sets "Windows" key as main modifier
#bind = ,XF86MonBrightnessDown, exec, brightnessctl s 10%-
#bind = ,XF86MonBrightnessUp, exec, brightnessctl s +10%
# Example binds, see https://wiki.hyprland.org/Configuring/Binds/ for more
bind = $mainMod, Q, exec, $terminal
bind = $mainMod, C, killactive,
bind = $mainMod, M, exit,
bind = $mainMod, E, exec, $fileManager
bind = $mainMod, V, exec, ~/.config/hypr/scripts/clipboard-history
bind = $mainMod SHIFT, V, togglefloating,

# Hide / show the Waybar
bind = CTRL, ESCAPE, exec, ~/.config/hypr/scripts/toggle-waybar
bind = $mainMod, R, exec, $menu
bind = $mainMod, P, pseudo, # dwindle
# dwindle: toggle split. J is the vim "focus down" key (below), so this sits on Shift+J.
bind = $mainMod SHIFT, J, layoutmsg, togglesplit

# Lock the screen. Plain L is the vim "focus right" key (below), so lock is Shift+L.
bind = $mainMod SHIFT, L, exec, hyprlock

# Idle inhibit toggle: stop / start hypridle (screen stays awake while paused).
# Same as clicking the waybar indicator next to the clock.
bind = $mainMod CTRL, I, exec, ~/.config/hypr/scripts/idle-toggle

# Screenshots (hyprshot saves to $screenshotDir, copies to clipboard and sends a
# notification through mako - drop -s if you don't want the notification)
bind = , PRINT, exec, hyprshot -m output -o $screenshotDir
bind = SHIFT, PRINT, exec, hyprshot -m region -z -o $screenshotDir
bind = $mainMod, PRINT, exec, hyprshot -m window -z -o $screenshotDir


# Move focus with mainMod + arrow keys
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# ...or the vim way: h/j/k/l
bind = $mainMod, H, movefocus, l
bind = $mainMod, J, movefocus, d
bind = $mainMod, K, movefocus, u
bind = $mainMod, L, movefocus, r

# Resize the active window, vim style: mainMod + CTRL + h/j/k/l
bind = $mainMod CTRL, H, resizeactive, -40 0
bind = $mainMod CTRL, J, resizeactive, 0 40
bind = $mainMod CTRL, K, resizeactive, 0 -40
bind = $mainMod CTRL, L, resizeactive, 40 0

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

# Example special workspace (scratchpad)
bind = $mainMod, S, togglespecialworkspace, magic
bind = $mainMod SHIFT, S, movetoworkspace, special:magic

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Laptop multimedia keys for volume and LCD brightness
bindel = ,XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.25 @DEFAULT_AUDIO_SINK@ 5%+
bindel = ,XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = ,XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, brightnessctl s 2.5%+
bindel = ,XF86MonBrightnessDown, exec, brightnessctl s 2.5%-

# Requires playerctl
bindl = , XF86AudioNext, exec, playerctl next
bindl = , XF86AudioPause, exec, playerctl play-pause
bindl = , XF86AudioPlay, exec, playerctl play-pause
bindl = , XF86AudioPrev, exec, playerctl previous
# Fullscreen: Super+F (Super+Shift+F kept as before)
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, F, exec, hyprctl dispatch fullscreen

#############################
### NOTIFICATIONS (mako)  ###
#############################
# Dismiss: Ctrl+, clears all notifications · Ctrl+Shift+, only the newest
bind = CTRL, comma, exec, makoctl dismiss -a
bind = CTRL SHIFT, comma, exec, makoctl dismiss
# Toggle notifications on/off (do-not-disturb mode): Ctrl+. or Super+Shift+N
bind = CTRL, period, exec, ~/.config/hypr/scripts/dnd-toggle
bind = $mainMod SHIFT, N, exec, ~/.config/hypr/scripts/dnd-toggle

##############################
### WINDOWS AND WORKSPACES ###
##############################

# See https://wiki.hyprland.org/Configuring/Window-Rules/ for more
# See https://wiki.hyprland.org/Configuring/Workspace-Rules/ for workspace rules

# Example windowrule v1
# windowrule = float, ^(kitty)$

# Example windowrule (v2 style matchers, Hyprland 0.55+ syntax: rules first, then match:*)
# windowrule = float, match:class ^(kitty)$, match:title ^(kitty)$

# Ignore maximize requests from apps. You'll probably like this.
# (suppressevent -> suppress_event, class:.* -> match:class .* in newer Hyprland)
windowrule = suppress_event maximize, match:class .*

# Fix some dragging issues with XWayland
# (nofocus -> no_focus true, floating -> float, pinned -> pin in newer Hyprland)
windowrule = no_focus true, match:class ^$, match:title ^$, match:xwayland 1, match:float 1, match:fullscreen 0, match:pin 0

# impala Wi-Fi TUI (opened from the waybar network module) floats, centered
windowrule = float true, match:class ^(impala)$
windowrule = size 60% 65%, match:class ^(impala)$
windowrule = center true, match:class ^(impala)$
