"$schema" = 'https://starship.rs/config-schema.json'

# GLOBAL PERFORMANCE
command_timeout = 500
add_newline = false
scan_timeout = 10

palette = 'catppuccin_mocha'

format = """
[](surface0)\
$os\
$username\
[](bg:peach fg:surface0)\
$directory\
[](fg:peach bg:green)\
$git_branch\
[](fg:green bg:teal)\
$rust\
$golang\
$nodejs\
$python\
[](fg:teal bg:blue)\
$docker_context\
[](fg:blue bg:purple)\
$time\
[ ](fg:purple)\
$line_break$character
"""

########################
# PALETTE
########################
[palettes.catppuccin_mocha]
peach = "#fab387"
green = "#a6e3a1"
teal = "#94e2d5"
blue = "#89b4fa"
purple = "#b4befe"
surface0 = "#313244"
mantle = "#181825"
base = "#1e1e2e"
text = "#cdd6f4"
red = "#f38ba8"

########################
# CORE MODULES
########################

[os]
disabled = false
style = "bg:surface0 fg:text"
format = "[ 󰣇 ]($style)"


[username]
show_always = true
style_user = "bg:surface0 fg:text"
format = '[ $user ]($style)'

[directory]
style = "fg:mantle bg:peach"
truncation_length = 3
truncation_symbol = "…/"
format = "[ $path ]($style)"

########################
# GIT (FAST MODE)
########################
[git_branch]
symbol = ""
style = "bg:green fg:base"
format = '[ $symbol $branch ]($style)'

# 🚀 DISABLED (big speed win)
[git_status]
disabled = true

########################
# LANGUAGES (ONLY WHEN PRESENT)
########################
[c]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_extensions = ["c", "h"]

[rust]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["Cargo.toml"]

[golang]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["go.mod"]

[nodejs]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["package.json", ".node-version"]
detect_extensions = ["js", "ts"]

[php]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["composer.json"]

[java]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["pom.xml", "build.gradle", "build.gradle.kts"]

[kotlin]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["build.gradle.kts"]

[haskell]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["stack.yaml", "cabal.project"]

[python]
symbol = ""
style = "bg:teal fg:base"
format = "[ $symbol $version ]($style)"
detect_files = ["pyproject.toml", "requirements.txt", ".python-version"]
python_binary = ["python3", "python"]########################
# DOCKER (LAZY)
########################
[docker_context]
symbol = ""
style = "bg:blue fg:base"
only_with_files = true
detect_files = ["docker-compose.yml", "Dockerfile"]
format = '[ $symbol ]($style)'

########################
# TIME (CHEAP MODE)
########################
[time]
disabled = false
time_format = "%R"
style = "bg:purple fg:mantle"
format = '[  $time ]($style)'

########################
# PROMPT SYMBOL
########################
[character]
success_symbol = '[](bold fg:green)'
error_symbol = '[](bold fg:red)'
vimcmd_symbol = '[](bold fg:teal)'
vimcmd_visual_symbol = '[](bold fg:purple)'
