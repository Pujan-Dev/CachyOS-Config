# ─────────────────────────────────────────────────────────────────────────────
# PREFIX CONFIGURATION
#   Main key  : Ctrl+a
#   Fallback  : Ctrl+\  (also works, for muscle memory)
# ─────────────────────────────────────────────────────────────────────────────

set -g prefix C-a
set -g prefix2 C-\\
bind C-a send-prefix
bind C-\\ send-prefix

# ─────────────────────────────────────────────────────────────────────────────
# CORE CONFIGURATION
# ─────────────────────────────────────────────────────────────────────────────

bind q source-file ~/.tmux.conf \; display "  Config reloaded"

# prefix + ? : scrollable cheatsheet (straight from the bottom of this file)
bind ? display-popup -E -w 78% -h 82% -T " tmux keys " \
  "grep -A 2000 '^# CHEATSHEET' ~/.tmux.conf | less -R"

# ─────────────────────────────────────────────────────────────────────────────
# VI MODE & COPY
# ─────────────────────────────────────────────────────────────────────────────

setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ─────────────────────────────────────────────────────────────────────────────
# PANE SPLITS — intuitive: | = vertical split, - = horizontal split
# ─────────────────────────────────────────────────────────────────────────────

bind | split-window -h -c "#{pane_current_path}"   # Prefix + | : split right
bind - split-window -v -c "#{pane_current_path}"   # Prefix + - : split down
bind \\ split-window -h -c "#{pane_current_path}"  # Prefix + \ : split right (no shift)
bind _ split-window -v -c "#{pane_current_path}"   # Prefix + _ : split down  (no shift)

# Keep old binds too (v/h) for muscle memory
bind h split-window -v -c "#{pane_current_path}"
bind v split-window -h -c "#{pane_current_path}"

bind x kill-pane
bind X confirm-before -p "Kill pane? (y/n)" kill-pane

# ─────────────────────────────────────────────────────────────────────────────
# PANE NAVIGATION — vim-style hjkl (aware of nvim)
# ─────────────────────────────────────────────────────────────────────────────

# Smart pane switching: if current pane is running nvim, pass keys to it
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|n?vim?x?)(diff)?$'"

bind -n C-h if-shell "$is_vim" 'send-keys C-h' 'select-pane -L'
bind -n C-j if-shell "$is_vim" 'send-keys C-j' 'select-pane -D'
bind -n C-k if-shell "$is_vim" 'send-keys C-k' 'select-pane -U'
bind -n C-l if-shell "$is_vim" 'send-keys C-l' 'select-pane -R'

# Also keep arrow-key navigation
bind -n C-M-Left  select-pane -L
bind -n C-M-Right select-pane -R
bind -n C-M-Up    select-pane -U
bind -n C-M-Down  select-pane -D

# Pane resizing — vim keys with prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Arrow resizing too
bind -n C-M-S-Left  resize-pane -L 5
bind -n C-M-S-Down  resize-pane -D 5
bind -n C-M-S-Up    resize-pane -U 5
bind -n C-M-S-Right resize-pane -R 5

# Zoom toggle
bind z resize-pane -Z

# ─────────────────────────────────────────────────────────────────────────────
# WINDOW MANAGEMENT
# ─────────────────────────────────────────────────────────────────────────────

bind r command-prompt -I "#W" "rename-window -- '%%'"
bind c new-window -c "#{pane_current_path}"
bind k kill-window
bind K confirm-before -p "Kill window? (y/n)" kill-window

# Window selection by number
bind -n M-1 select-window -t 1
bind -n M-2 select-window -t 2
bind -n M-3 select-window -t 3
bind -n M-4 select-window -t 4
bind -n M-5 select-window -t 5
bind -n M-6 select-window -t 6
bind -n M-7 select-window -t 7
bind -n M-8 select-window -t 8
bind -n M-9 select-window -t 9

# Window cycling
bind -n M-Left  select-window -t -1
bind -n M-Right select-window -t +1

# Window swapping
bind -n M-S-Left  swap-window -t -1 \; select-window -t -1
bind -n M-S-Right swap-window -t +1 \; select-window -t +1

# Extra binds (no prefix)
bind -n M-n new-window -c "#{pane_current_path}"   # ALT+n : new window
bind -n M-w kill-window                             # ALT+w : close window
bind -n M-= swap-window -t +1 \; select-window -t:+1  # ALT+= : move right
bind -n M-- swap-window -t -1 \; select-window -t:-1  # ALT+- : move left

# ─────────────────────────────────────────────────────────────────────────────
# SESSION MANAGEMENT
# ─────────────────────────────────────────────────────────────────────────────

bind R command-prompt -I "#S" "rename-session -- '%%'"
bind C new-session -c "#{pane_current_path}"
bind K kill-session
bind P switch-client -p
bind N switch-client -n

bind -n M-Up   switch-client -p
bind -n M-Down switch-client -n

# ─────────────────────────────────────────────────────────────────────────────
# TERMINAL & GENERAL SETTINGS
# ─────────────────────────────────────────────────────────────────────────────

set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
set -g allow-passthrough on

set -g mouse on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -g escape-time 0
set -g focus-events on
set -g set-clipboard on
setw -g aggressive-resize on
set -g detach-on-destroy off

# ─────────────────────────────────────────────────────────────────────────────
# STATUS BAR — Catppuccin Mocha, one calm line
# ─────────────────────────────────────────────────────────────────────────────

set -g status-position top
set -g status-interval 5
set -g status-justify left
set -g status-left-length 40
set -g status-right-length 100
set -g window-status-separator ""
set -gw automatic-rename on
set -gw automatic-rename-format '#{b:pane_current_path}'

# Window titles in the terminal/tab bar too (session: window)
set -g set-titles on
set -g set-titles-string "#S: #W"

# Show activity/bell in the tab colour instead of popping messages over the pane
setw -g monitor-activity on
set -g visual-activity off
set -g visual-bell off

# Bar background & default text
set -g status-style "bg=#1e1e2e,fg=#a6adc8"

# Left: Arch mark + session name (accent pill)
set -g status-left "#[fg=#1e1e2e,bg=#89b4fa,bold]  󰣇 #S #[fg=#89b4fa,bg=#1e1e2e,nobold]  "

# Right: active pane path (~ = $HOME) │ state indicators │ clock
set -g status-right "#[fg=#6c7086]#{=-34:#{s|^#{HOME}|~|:pane_current_path}} #[fg=#45475a]│ #[fg=#cba6f7]#{?pane_in_mode,󰅍 COPY ,}#{?client_prefix,󰌌 PREFIX ,}#{?window_zoomed_flag,󰊓 ZOOM ,}#[fg=#a6adc8]%H:%M "

# Window tabs — quiet when idle, accent pill when active, amber when they want you
set -g window-status-format         "#[fg=#6c7086] #I #[fg=#a6adc8]#W#{?window_zoomed_flag,#[fg=#f9e2af] 󰊓,} "
set -g window-status-current-format "#[fg=#1e1e2e,bg=#b4befe,bold] #I #W#{?window_zoomed_flag, 󰊓,} #[fg=#b4befe,bg=#1e1e2e,nobold] "
set -g window-status-activity-style "fg=#f9e2af,bg=#1e1e2e"
set -g window-status-bell-style     "fg=#f38ba8,bg=#1e1e2e,bold"

# Pane borders — slim and clear
set -g pane-border-style          "fg=#313244"
set -g pane-active-border-style   "fg=#89b4fa"
set -g pane-border-indicators     colour

# Messages
set -g message-style         "bg=#1e1e2e,fg=#89b4fa"
set -g message-command-style "bg=#1e1e2e,fg=#89b4fa"

# Popups (prefix + ?)
set -g popup-style          "bg=#1e1e2e,fg=#cdd6f4"
set -g popup-border-style   "fg=#89b4fa"
set -g popup-border-lines   rounded
set -g mode-style            "bg=#b4befe,fg=#1e1e2e"
setw -g clock-mode-colour    "#89b4fa"

# ─────────────────────────────────────────────────────────────────────────────
# PLUGINS (TPM)
# ─────────────────────────────────────────────────────────────────────────────

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
set -g @resurrect-processes 'btop lazydocker lazygit htop nvim'

set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @continuum-restore 'on'

# Initialize TMUX plugin manager (keep at very bottom)
run '~/.tmux/plugins/tpm/tpm'

# ─────────────────────────────────────────────────────────────────────────────
# CHEATSHEET (comments only)
# ─────────────────────────────────────────────────────────────────────────────
# PREFIX = Ctrl+a (fallback: Ctrl+\)
#
# SPLITS
#   prefix + |  or  prefix + \   → split right (vertical pane)
#   prefix + -  or  prefix + _   → split down  (horizontal pane)
#
# PANE NAV (vim-aware — works inside nvim too via C-h/j/k/l)
#   C-h / C-j / C-k / C-l       → move left/down/up/right
#   prefix + H/J/K/L             → resize pane
#   prefix + z                   → zoom/unzoom pane
#   prefix + x                   → kill pane
#
# WINDOWS
#   prefix + c        → new window
#   prefix + r        → rename window
#   prefix + k        → kill window
#   M-1…9            → jump to window
#   M-Left/Right      → prev/next window
#   M-n               → new window
#   M-w               → close window
#   M-= / M--         → move window right/left
#
# SESSIONS
#   prefix + C  → new session
#   prefix + R  → rename session
#   prefix + K  → kill session
#   prefix + P/N or M-Up/Down → prev/next session
#
# CONFIG
#   prefix + q  → reload config
#   prefix + ?  → this cheatsheet (popup)
#
# TPM
#   prefix + I        → install plugins
#   prefix + U        → update plugins
#   prefix + alt+u    → remove unused plugins
